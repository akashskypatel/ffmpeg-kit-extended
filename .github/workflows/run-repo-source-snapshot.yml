name: One-shot dev-wasm source snapshot

on:
  push:
    branches:
      - automation/repo-source-snapshot-996c172
    paths:
      - '.github/workflows/run-repo-source-snapshot.yml'

permissions:
  contents: read

jobs:
  snapshot:
    uses: ./.github/workflows/repo-source-snapshot.yml
    with:
      source_ref: b861325f921ad424dc24790872997257cf8f7015
      artifact_prefix: dev-wasm-source-snapshot
      retention_days: 7
      include_submodules: true
      include_lfs: false
