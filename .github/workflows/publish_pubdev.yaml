name: Publish to pub.dev

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Set up Dart publishing auth
        uses: dart-lang/setup-dart@v1

      - name: Install package dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Activate pana
        working-directory: flutter
        run: dart pub global activate pana && export PATH="$PATH":"$HOME/.pub-cache/bin" && dart format . && pana . --no-dartdoc

      - name: Fix Static Analysis Issues (Core)
        working-directory: flutter
        run: dart fix --apply
      
      - name: Fix Static Analysis Issues (Example)
        working-directory: flutter/example
        run: dart fix --apply

      - name: Publish package
        working-directory: flutter
        run: flutter pub publish --force --ignore-warnings
        run: flutter pub publish --force --ignore-warnings
