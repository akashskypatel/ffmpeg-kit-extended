name: React Native Web checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "react-native/**"
      - ".github/workflows/react_native_web_ci.yaml"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "react-native/**"
      - ".github/workflows/react_native_web_ci.yaml"

permissions:
  contents: read

concurrency:
  group: react-native-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: |
            react-native/package-lock.json
            react-native/example/package-lock.json

      - name: Install package dependencies
        working-directory: react-native
        run: npm ci

      - name: Install example dependencies
        working-directory: react-native/example
        run: npm ci

      - name: Run package checks
        working-directory: react-native
        run: npm run check

      - name: Build package
        working-directory: react-native
        run: npm run prepare

      - name: Validate package contents
        working-directory: react-native
        run: npm pack --dry-run

      - name: Build Web example
        working-directory: react-native/example
        run: npm run web:build

      # The real Wasm smoke command is run with a locally staged builder output
      # because this repository intentionally does not publish the large runtime
      # binary as an npm package or browser download.
