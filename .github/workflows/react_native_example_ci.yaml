name: React Native Example App CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "react-native/**"
      - "!flutter/**"
      - ".github/workflows/react_native_example_ci.yaml"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "react-native/**"
      - "!flutter/**"
      - ".github/workflows/react_native_example_ci.yaml"

permissions:
  contents: read

concurrency:
  group: react-native-example-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.pull_request.draft == false
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: ios
            os: macos-latest
          - platform: appletvos
            os: macos-latest
          - platform: macos
            os: macos-latest
          - platform: windows
            os: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: |
            react-native/package-lock.json
            react-native/example/package-lock.json

      - name: Set up Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: matrix.platform == 'android'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
          cache-provider: basic

      - name: Install package dependencies
        working-directory: react-native
        run: npm ci

      - name: Install shared example dependencies
        if: matrix.platform == 'android' || matrix.platform == 'ios'
        working-directory: react-native/example
        run: npm ci

      - name: Generate Android Gradle wrapper
        if: matrix.platform == 'android'
        working-directory: react-native/example/android
        run: gradle wrapper --gradle-version 8.13 --distribution-type bin --no-daemon

      - name: Build ${{ matrix.platform }} example
        working-directory: react-native/example
        shell: bash
        run: npm run build:${{ matrix.platform }}
