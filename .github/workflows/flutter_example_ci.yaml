name: Flutter Example App CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "flutter/**"
      - ".github/workflows/flutter_example_ci.yaml"
      - "**.dart"
      - "**.yaml"
      - "**.yml"
      - "**.gradle"
      - "**.kt"
      - "**.swift"
      - "**.m"
      - "**.h"
      - "**.mm"
      - "**.hpp"
      - "**.c"
      - "**.cpp"
      - "**.cc"
      - "**.podspec"
      - "!**.md"
      - "!react-native/**"
      - "!flutter/doc/**"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "flutter/**"
      - ".github/workflows/flutter_example_ci.yaml"
      - "**.dart"
      - "**.yaml"
      - "**.yml"
      - "**.gradle"
      - "**.kt"
      - "**.swift"
      - "**.m"
      - "**.h"
      - "**.mm"
      - "**.podspec"
      - "**.hpp"
      - "**.c"
      - "**.cpp"
      - "**.cc"
      - "!**.md"
      - "!react-native/**"
      - "!flutter/doc/**"

concurrency:
  group: flutter-example-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.pull_request.draft == false
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            artifact_name: app-debug.apk
            build_command: flutter build apk --debug
          - platform: ios
            os: macos-latest
            artifact_name: Runner.app
            build_command: flutter build ios --debug --no-codesign
          - platform: ios-simulator
            os: macos-latest
            artifact_name: Runner.app
            build_command: flutter build ios --simulator --debug --no-codesign
          - platform: windows
            os: windows-latest
            artifact_name: build\windows\x64\runner\Debug
            build_command: flutter build windows --debug
          - platform: linux
            os: ubuntu-latest
            artifact_name: build/linux/x64/debug/bundle
            build_command: flutter build linux --debug
          - platform: macos
            os: macos-latest
            artifact_name: build/macos/Build/Products/Debug
            build_command: flutter build macos --debug

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: "stable"
          cache: true

      - name: Set path for WSL builds
        if: matrix.platform == 'windows'
        run: |
          echo "$WINDIR\\System32" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure Android SDK
        if: matrix.platform == 'android'
        run: |
          flutter config --no-analytics
          yes | flutter doctor --android-licenses >/dev/null

      - name: Configure Apple build
        if: matrix.platform == 'ios' || matrix.platform == 'ios-simulator' || matrix.platform == 'macos'
        run: |
          flutter config --no-analytics
          flutter config --enable-swift-package-manager
          sudo xcodebuild -license accept 2>/dev/null || true

      - name: Configure Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          flutter config --no-analytics
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev pkg-config cmake ninja-build liblzma-dev libstdc++-12-dev

      - name: Install bundle dependencies
        working-directory: flutter/example
        run: flutter pub get

      - name: Get Flutter dependencies
        working-directory: flutter/example
        run: flutter pub get --offline || true

      - name: Unlock keychain
        if: matrix.platform == 'ios'
        run: |
          security default-keychain -s login.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" ~/Library/Keychains/login.keychain
          security set-keychain-settings -lut 21600 ~/Library/Keychains/login.keychain

      - name: Build ${{ matrix.platform }}
        working-directory: flutter/example
        run: ${{ matrix.build_command }}

      - name: Upload artifacts
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-app
          path: flutter/example/build/app/outputs/flutter-apk/${{ matrix.artifact_name }}
          retention-days: 7

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-app
          path: flutter/example/${{ matrix.artifact_name }}
          retention-days: 7

      - name: Upload artifacts (Linux)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-app
          path: flutter/example/${{ matrix.artifact_name }}
          retention-days: 7

      - name: Upload artifacts (iOS)
        if: matrix.platform == 'ios'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-app
          path: flutter/example/build/ios/iphoneos/
          retention-days: 7

      - name: Upload artifacts (iOS Simulator)
        if: matrix.platform == 'ios-simulator'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-app
          path: flutter/example/build/ios/iphonesimulator/
          retention-days: 7

      - name: Upload artifacts (macOS)
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-app
          path: flutter/example/${{ matrix.artifact_name }}
          retention-days: 7

  verify:
    if: github.event.pull_request.draft == false
    name: Package Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: "stable"
          cache: true

      - name: Get plugin dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Check Dart formatting
        working-directory: flutter
        run: dart format --output=none --set-exit-if-changed hook test

      - name: Run Dart analyze
        working-directory: flutter
        run: dart analyze

      - name: Run Flutter analyze
        working-directory: flutter
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: flutter
        run: flutter test --exclude-tags native

      - name: Build stable default Flutter Web Wasm
        working-directory: flutter/example
        run: flutter build web --wasm

      - name: Verify package publication contents
        working-directory: flutter
        run: dart pub publish --dry-run

  web-runtime-smoke:
    if: github.event.pull_request.draft == false
    name: Flutter Web Runtime Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone Flutter SDK (stable default Web runtime)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Configure Flutter Web runtime
        run: flutter config --no-analytics

      - name: Get plugin dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Get Web smoke dependencies
        working-directory: flutter/example
        run: flutter pub get

      - name: Install headless browser
        run: |
          set -euo pipefail
          smoke_dir="$RUNNER_TEMP/ffmpeg-web-smoke"
          mkdir -p "$smoke_dir"
          npm --prefix "$smoke_dir" init --yes
          npm --prefix "$smoke_dir" install --no-save playwright@1.52.0
          "$smoke_dir/node_modules/.bin/playwright" install --with-deps chromium
          cp "$GITHUB_WORKSPACE/flutter/example/web_runtime_smoke.mjs" "$smoke_dir/web_runtime_smoke.mjs"

      - name: Start Flutter Web Wasm server
        working-directory: flutter/example
        run: |
          set -euo pipefail
          smoke_log="$RUNNER_TEMP/ffmpeg-web-smoke/flutter-run.log"
          smoke_pid="$RUNNER_TEMP/ffmpeg-web-smoke/flutter-run.pid"
          flutter run -d web-server --wasm --cross-origin-isolation \
            --web-hostname 127.0.0.1 --web-port 8080 \
            --target=lib/web_runtime_smoke.dart >"$smoke_log" 2>&1 &
          echo $! >"$smoke_pid"
          for attempt in $(seq 1 180); do
            if ! kill -0 "$(cat "$smoke_pid")" 2>/dev/null; then
              cat "$smoke_log"
              exit 1
            fi
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$smoke_log"
          exit 1

      - name: Run Flutter Web browser smoke
        run: node "$RUNNER_TEMP/ffmpeg-web-smoke/web_runtime_smoke.mjs" http://127.0.0.1:8080/ wasm

      - name: Stop Flutter Web server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/ffmpeg-web-smoke/flutter-run.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/ffmpeg-web-smoke/flutter-run.pid")" 2>/dev/null || true
          fi

      - name: Upload Flutter Web smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-runtime-smoke-log
          path: ${{ runner.temp }}/ffmpeg-web-smoke/flutter-run.log
          if-no-files-found: warn

  web-custom-override-smoke:
    if: github.event.pull_request.draft == false
    name: Flutter Web Custom DataAsset Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone Flutter SDK (master for custom DataAssets)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: master
          channel: master
          cache: true

      - name: Configure Flutter custom DataAssets
        run: flutter config --no-analytics --enable-dart-data-assets

      - name: Get custom fixture dependencies
        working-directory: flutter/test/fixtures/review16_custom_web_workspace
        run: flutter pub get

      - name: Build custom Web Wasm fixture
        working-directory: flutter/test/fixtures/review16_custom_web_workspace/apps/app
        run: flutter build web --wasm --no-pub

      - name: Install headless browser
        run: |
          set -euo pipefail
          smoke_dir="$RUNNER_TEMP/ffmpeg-web-custom-smoke"
          mkdir -p "$smoke_dir"
          npm --prefix "$smoke_dir" init --yes
          npm --prefix "$smoke_dir" install --no-save playwright@1.52.0
          "$smoke_dir/node_modules/.bin/playwright" install --with-deps chromium
          cp "$GITHUB_WORKSPACE/flutter/example/web_runtime_smoke.mjs" "$smoke_dir/web_runtime_smoke.mjs"

      - name: Start custom Flutter Web Wasm server
        working-directory: flutter/test/fixtures/review16_custom_web_workspace/apps/app
        run: |
          set -euo pipefail
          smoke_log="$RUNNER_TEMP/ffmpeg-web-custom-smoke/flutter-run.log"
          smoke_pid="$RUNNER_TEMP/ffmpeg-web-custom-smoke/flutter-run.pid"
          flutter run -d web-server --wasm --cross-origin-isolation \
            --web-hostname 127.0.0.1 --web-port 8080 \
            --target=lib/main.dart >"$smoke_log" 2>&1 &
          echo $! >"$smoke_pid"
          for attempt in $(seq 1 180); do
            if ! kill -0 "$(cat "$smoke_pid")" 2>/dev/null; then
              cat "$smoke_log"
              exit 1
            fi
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$smoke_log"
          exit 1

      - name: Run custom Web browser smoke
        run: node "$RUNNER_TEMP/ffmpeg-web-custom-smoke/web_runtime_smoke.mjs" http://127.0.0.1:8080/ wasm_override

      - name: Stop custom Flutter Web server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/ffmpeg-web-custom-smoke/flutter-run.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/ffmpeg-web-custom-smoke/flutter-run.pid")" 2>/dev/null || true
          fi

      - name: Upload custom Web smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-custom-runtime-smoke-log
          path: ${{ runner.temp }}/ffmpeg-web-custom-smoke/flutter-run.log
          if-no-files-found: warn

  verify-native-linux:
    needs: build
    if: github.event.pull_request.draft == false
    name: Native API Verification (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: "stable"
          cache: true

      - name: Install Linux runtime dependencies
        run: |
          flutter config --no-analytics
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-0 libstdc++-12-dev

      - name: Download staged Linux app
        uses: actions/download-artifact@v4
        with:
          name: linux-app
          path: flutter/example/build/linux/x64/debug/bundle

      - name: Locate staged FFmpegKit library
        run: |
          native_dir="$(find "$GITHUB_WORKSPACE/flutter/example/build/linux/x64/debug/bundle" -type f -name 'libffmpegkit.so' -printf '%h\n' | head -n 1)"
          if [[ -z "$native_dir" ]]; then
            echo "The staged Linux app does not contain libffmpegkit.so" >&2
            find "$GITHUB_WORKSPACE/flutter/example/build/linux/x64/debug/bundle" -maxdepth 4 -type f | sort >&2
            exit 1
          fi
          echo "LD_LIBRARY_PATH=$native_dir:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "Using staged native library directory: $native_dir"

      - name: Get plugin dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Run native API tests
        working-directory: flutter
        run: flutter test --tags native test/api_test.dart
