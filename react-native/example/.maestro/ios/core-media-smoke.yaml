appId: org.reactjs.native.example.FFmpegKitExtendedExample
---
- launchApp
- assertVisible:
    id: tab.ffmpeg
- assertVisible:
    id: tab.stream
- assertVisible:
    id: tab.ffprobe
- assertVisible:
    id: tab.ffplay
- assertVisible:
    id: tab.transcode
- runFlow:
    file: ../shared/ffmpeg-version.yaml
    env:
      APP_ID: org.reactjs.native.example.FFmpegKitExtendedExample
- runFlow:
    file: ../shared/generated-media-probe.yaml
    env:
      APP_ID: org.reactjs.native.example.FFmpegKitExtendedExample
- runFlow:
    file: ../shared/ffplay-control-cycle.yaml
    env:
      APP_ID: org.reactjs.native.example.FFmpegKitExtendedExample
- runFlow:
    file: ../shared/transcode-generated-media.yaml
    env:
      APP_ID: org.reactjs.native.example.FFmpegKitExtendedExample
