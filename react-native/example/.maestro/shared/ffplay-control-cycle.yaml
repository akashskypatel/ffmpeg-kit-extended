appId: ${APP_ID}
---
- tapOn:
    id: tab.ffplay
- tapOn:
    id: ffplay.play-video
- scrollUntilVisible:
    element:
      id: ffplay.pause
    direction: DOWN
    timeout: 10000
- tapOn:
    id: ffplay.pause
- tapOn:
    id: ffplay.resume
- scrollUntilVisible:
    element:
      id: ffplay.seek-forward
    direction: DOWN
    timeout: 10000
- tapOn:
    id: ffplay.seek-forward
- tapOn:
    id: ffplay.seek-back
- tapOn:
    id: ffplay.stop
- assertVisible:
    id: ffplay.position
