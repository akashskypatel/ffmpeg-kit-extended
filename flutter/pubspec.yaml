name: ffmpeg_kit_extended_flutter
description: A comprehensive Flutter plugin for executing FFmpeg, FFprobe, and FFplay commands using FFmpeg 9.0.1 API. Supports Android, iOS, macOS, Linux, Windows, and WebAssembly web builds.
repository: https://github.com/akashskypatel/ffmpeg-kit-extended
issue_tracker: https://github.com/akashskypatel/ffmpeg-kit-extended/issues
homepage: https://github.com/akashskypatel/ffmpeg-kit-extended
documentation: https://github.com/akashskypatel/ffmpeg-kit-extended/tree/master/flutter/doc
version: 1.0.0

# Local-only plugin package test inputs. These paths are used for local
# package-level validation and must never resolve a historical published
# runtime.
ffmpeg_kit_extended_config:
  type: "base"
  gpl: false
  small: false
  wasm: '\\wsl.localhost\ManyLinux\home\vscode\ffmpeg-kit-builders\prebuilt\wasm-wasm32\releases\bundle-base-wasm-wasm32-static-lgpl.zip'
  web: '\\wsl.localhost\ManyLinux\home\vscode\ffmpeg-kit-builders\prebuilt\wasm-wasm32\releases\bundle-base-wasm-wasm32-static-lgpl.zip'
  windows: '\\wsl.localhost\ManyLinux\home\vscode\ffmpeg-kit-builders\prebuilt\windows-x86_64\releases\bundle-base-windows-x86_64-shared-lgpl.zip'
  linux: '\\wsl.localhost\ManyLinux\home\vscode\ffmpeg-kit-builders\prebuilt\linux-x86_64\releases\bundle-base-linux-x86_64-shared-lgpl.zip'

topics:
  - ffmpeg
  - media-processing
  - transcoding
  - media-tagging
  - ffmpeg-kit

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.47.0"

flutter:
  plugin:
    platforms:
      linux:
        pluginClass: FfmpegKitExtendedFlutterPlugin
      windows:
        pluginClass: FfmpegKitExtendedFlutterPlugin
      android:
        package: com.akashskypatel.ffmpeg_kit_extended_flutter
        pluginClass: FfmpegKitExtendedFlutterPlugin
      ios:
        pluginClass: FfmpegKitExtendedFlutterPlugin
        fileName: FfmpegKitExtendedFlutterPlugin.h
      macos:
        pluginClass: FfmpegKitExtendedFlutterPlugin
        fileName: FfmpegKitExtendedFlutterPlugin.h
      web:
        pluginClass: FfmpegKitExtendedFlutterWeb
        fileName: ffmpeg_kit_extended_flutter_web.dart

dependencies:
  code_assets: ^2.1.0
  crypto: ^3.0.7
  ffi: ^2.2.0
  ffigen_js: ^0.0.16-pre
    # git:
    #   url: https://github.com/akashskypatel/ffigen_js.git
    #   ref: bc03f738207eb88bcd8e9cece93756bbae80cdd5
    # path: ../../ffigen_js
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  hooks: ^2.2.0
  logging: ^1.3.0
  meta: ^1.18.0
  path: ^1.9.1
  plugin_platform_interface: ^2.1.8
  web: ^1.1.1
  yaml: ^3.1.4

dev_dependencies:
  ffigen: ^22.0.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  leak_tracker_flutter_testing: ^3.0.10
  lints: ^6.1.0
  test: ^1.31.1
