name: ffmpeg_kit_extended_flutter_example
description: "Demonstrates how to use the ffmpeg_kit_extended_flutter plugin."
repository: https://github.com/akashskypatel/ffmpeg-kit-extended
issue_tracker: https://github.com/akashskypatel/ffmpeg-kit-extended/issues
homepage: https://github.com/akashskypatel/ffmpeg-kit-extended
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  ffmpeg_kit_extended_flutter:
    path: ../

  cupertino_icons: ^1.0.9
  path: ^1.9.1
  file_picker: ^13.1.0
  android_media_store: ^0.0.4
  permission_handler: ^13.0.1
  path_provider: ^2.1.6
  window_manager: ^0.5.2
  marionette_flutter: ^0.6.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: true

hooks:
  user_defines:
    ffmpeg_kit_extended_flutter:
      type: "base"
      gpl: false
      small: false
      # Local-only test inputs produced by the elevated WSL runner from the
      # FFmpegKit builder dev checkout; no published binary is valid for the
      # in-place structured callback ABI.
      wasm: '\\wsl.localhost\ManyLinux\home\vscode\ffmpeg-kit-builders\prebuilt\wasm-wasm32\releases\bundle-base-wasm-wasm32-static-lgpl.zip'
      web: '\\wsl.localhost\ManyLinux\home\vscode\ffmpeg-kit-builders\prebuilt\wasm-wasm32\releases\bundle-base-wasm-wasm32-static-lgpl.zip'
      windows: '\\wsl.localhost\ManyLinux\home\vscode\ffmpeg-kit-builders\prebuilt\windows-x86_64\releases\bundle-base-windows-x86_64-shared-lgpl.zip'
      linux: '\\wsl.localhost\ManyLinux\home\vscode\ffmpeg-kit-builders\prebuilt\linux-x86_64\releases\bundle-base-linux-x86_64-shared-lgpl.zip'
      # MacBook Air local universal XCFramework archives for deferred Apple validation.
      ios: '/Users/akash/Projects/ffmpeg-kit-builders/prebuilt/apple/xcframeworks/bundle-base-ios-universal-small-lgpl.xcframework.zip'
      macos: '/Users/akash/Projects/ffmpeg-kit-builders/prebuilt/apple/xcframeworks/bundle-base-macos-universal-small-lgpl.xcframework.zip'
